<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>הקיוסק של 42 — נגן</title>
<script src="config.js"></script>
<script src="utils.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Heebo', 'Segoe UI', sans-serif;
  }

  /* ── Waiting screen ──
     Always rendered, sitting UNDER the stage. Any moment where content isn't
     ready yet (loading, switching, a broken item) shows this instead of black. */
  #idle {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    direction: rtl;
    background: radial-gradient(ellipse at 50% -20%, #2a2416 0%, #0d0f14 55%, #000 100%);
    color: #F1F5F9;
  }
  /* vmin so the waiting screen scales the same on landscape and portrait screens */
  #fbClock {
    font-size: 22vmin; font-weight: 800; line-height: 1;
    letter-spacing: 0.02em;
    color: #FBBF24;
    text-shadow: 0 0 80px rgba(245, 158, 11, 0.35);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  #fbDate { font-size: 4.6vmin; font-weight: 400; color: #94A3B8; margin-top: 2vh; text-align: center; }
  #fbMessage {
    font-size: 5vmin; font-weight: 700; color: #F1F5F9;
    margin-top: 7vh; text-align: center; padding: 0 8vmin; line-height: 1.35;
  }
  #fbName { font-size: 3.2vmin; font-weight: 600; color: #64748B; margin-top: 3vh; text-align: center; }
  #fbHint { font-size: 2.4vmin; color: #475569; margin-top: 2vh; text-align: center; padding: 0 6vmin; }

  /* ── Content stage ──
     Hidden until the content actually starts playing/loading is done, so a
     slow item never paints a black rectangle over the waiting screen. */
  #stage {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 2;
    pointer-events: none;
  }
  #stage.visible { opacity: 1; }
  #stage iframe, #stage video, #stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #000;
  }
  #stage video, #stage img { object-fit: contain; }
  /* "cover" mode for embedded players (YouTube/Drive): the iframe keeps a 16:9
     box and is scaled up until it covers the screen, so a portrait screen shows
     a cropped full-bleed video instead of thick black bars. */
  #stage iframe.cover {
    inset: auto; top: 50%; left: 50%;
    transform-origin: center center;
  }

  /* ── Clock overlay while content plays ── */
  #clockPill {
    position: fixed; bottom: 22px; left: 22px; z-index: 10;
    padding: 8px 18px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    color: #fff; font-size: 1.4rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
    direction: ltr;
    display: none;
  }
  #clockPill.show { display: block; }

  /* ── Offline indicator (only after repeated fetch failures) ── */
  #offlineDot {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    width: 10px; height: 10px; border-radius: 50%;
    background: #EF4444;
    box-shadow: 0 0 8px #EF4444;
    display: none;
    animation: blink 1.6s ease infinite;
  }
  #offlineDot.show { display: block; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* toasts are irrelevant on the kiosk screen */
  .toast-container { display: none !important; }
</style>
</head>
<body>

<div id="idle">
  <div id="fbClock">--:--</div>
  <div id="fbDate"></div>
  <div id="fbMessage"></div>
  <div id="fbName"></div>
  <div id="fbHint"></div>
</div>

<div id="stage"></div>

<div id="clockPill">--:--</div>
<div id="offlineDot"></div>

<script>
'use strict';

// How long to wait for an item to actually start before giving up on it.
// The waiting screen is showing throughout, so this is never a black screen.
const LOAD_TIMEOUT_MS   = 7000;
const DRIVE_TRY_TIMEOUT = 4500;   // per Drive URL strategy
const SINGLE_RETRY_MS   = 20000;  // lone broken item: retry instead of rotating

// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
const S = {
  items: [],            // active items, sorted by order
  settings: null,
  token: null,          // reloadToken adopted on first fetch; change → reload
  idx: -1,
  currentId: null,
  currentTitle: null,
  currentItemJson: null,
  playCount: 0,         // completed plays of the current video
  advanceTimer: null,
  safetyTimer: null,
  loadTimer: null,
  pollTimer: null,
  yt: null,             // current YT.Player instance
  ytApiPromise: null,
  failStreak: 0,
  wakeLock: null,
  driveWatchdog: null,
  driveTimed: false,    // Drive fell back to its own player → advance on a timer
  coverResize: null
};

const CACHE_KEY = 'kioskCache';
const $ = id => document.getElementById(id);

// ════════════════════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════════════════════
(function boot() {
  startClocks();
  requestWakeLock();
  goFullscreen();

  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.includes('PASTE_')) {
    $('fbName').textContent = 'הקיוסק של 42';
    $('fbHint').textContent = '⚠ יש להגדיר את SCRIPT_URL בקובץ config.js';
    return;
  }

  // Start instantly from the last known playlist, then fetch fresh.
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (cached && cached.items) applyData(cached, true);
  } catch (_) {}

  warmupServer();
  poll();
})();

// ════════════════════════════════════════════════════════════
// Polling — fetch playlist + report heartbeat
// ════════════════════════════════════════════════════════════
async function poll() {
  try {
    const res = await apiCall('getPlaylist', { current: S.currentTitle || 'מסך המתנה' });
    // A non-JSON reply (Google error page during a redeploy) must never be
    // mistaken for an empty playlist — that would blank a working screen.
    if (res.success && Array.isArray(res.items)) {
      S.failStreak = 0;
      applyData(res, false);
    } else {
      S.failStreak++;
    }
  } catch (e) {
    S.failStreak++;
  }
  $('offlineDot').classList.toggle('show', S.failStreak >= 3);

  const sec = (S.settings && S.settings.refreshSeconds) || 60;
  clearTimeout(S.pollTimer);
  S.pollTimer = setTimeout(poll, Math.max(15, sec) * 1000);

  checkDailyReload();
}

function applyData(res, fromCache) {
  const settings = res.settings || {};

  if (!fromCache) {
    // Admin pressed "רענן מסך" (or pushed new frontend) → full reload.
    if (S.token !== null && settings.reloadToken !== S.token) {
      location.reload();
      return;
    }
    S.token = settings.reloadToken;
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ items: res.items, settings: settings }));
    } catch (_) {}
  }

  S.settings = settings;
  $('fbName').textContent = settings.kioskName || '';
  $('fbMessage').textContent = settings.idleMessage || '';
  updateClockVisibility();

  const active = (res.items || []).filter(i => i.active);

  if (!active.length) {
    stopCurrent();
    S.items = []; S.idx = -1; S.currentId = null; S.currentTitle = null;
    showStage(false);
    return;
  }

  const changed = JSON.stringify(active) !== JSON.stringify(S.items);
  if (!changed) {
    if (S.currentId === null) { S.idx = -1; next(); }
    return;
  }

  const oldCurrentId = S.currentId;
  S.items = active;
  const newIdx = oldCurrentId ? active.findIndex(i => i.id === oldCurrentId) : -1;

  if (newIdx !== -1) {
    // Current item survived the update — keep playing unless it was edited.
    S.idx = newIdx;
    if (JSON.stringify(active[newIdx]) !== S.currentItemJson) renderItem(active[newIdx]);
  } else {
    S.idx = -1;
    next();
  }
}

// ════════════════════════════════════════════════════════════
// Rotation
// ════════════════════════════════════════════════════════════
function next() {
  if (!S.items.length) { showStage(false); return; }
  const prevId = S.currentId;
  S.idx = (S.idx + 1) % S.items.length;
  const item = S.items[S.idx];

  // Single static item — don't flash-reload it, just re-arm the timer.
  if (S.items.length === 1 && item.id === prevId &&
      (item.type === 'website' || item.type === 'image')) {
    armTimers(item);
    return;
  }
  renderItem(item);
}

function renderItem(item) {
  stopCurrent();
  S.currentId = item.id;
  S.currentTitle = item.title;
  S.currentItemJson = JSON.stringify(item);
  S.playCount = 0;
  S.driveTimed = false;

  // Hide the stage while the new item loads → the waiting screen shows through.
  showStage(false);
  const stage = $('stage');
  stage.innerHTML = '';

  switch (item.type) {
    case 'youtube': renderYouTube(stage, item); break;
    case 'video':   renderVideo(stage, item);   break;
    case 'drive':   renderDrive(stage, item);   break;
    case 'image':   renderImage(stage, item);   break;
    default:        renderWebsite(stage, item); break;
  }

  // If it never starts, move on (or retry when it's the only item) rather than
  // sitting on a dead item.
  clearTimeout(S.loadTimer);
  S.loadTimer = setTimeout(() => {
    if (S.currentId !== item.id || stageVisible()) return;
    if (S.items.length > 1) next();
    else { S.currentId = null; setTimeout(() => renderItem(item), SINGLE_RETRY_MS); }
  }, LOAD_TIMEOUT_MS);

  armTimers(item);
}

// Content is actually up — reveal it over the waiting screen.
function contentReady(item) {
  if (S.currentId !== item.id) return;
  clearTimeout(S.loadTimer);
  showStage(true);
}

function stopCurrent() {
  clearTimeout(S.advanceTimer);  S.advanceTimer = null;
  clearTimeout(S.safetyTimer);   S.safetyTimer = null;
  clearTimeout(S.loadTimer);     S.loadTimer = null;
  clearTimeout(S.driveWatchdog); S.driveWatchdog = null;
  if (S.coverResize) { window.removeEventListener('resize', S.coverResize); S.coverResize = null; }
  if (S.yt) { try { S.yt.destroy(); } catch (_) {} S.yt = null; }
}

function isVideoType(item) {
  return item.type === 'youtube' || item.type === 'video' || item.type === 'drive';
}

// 0 = play forever, N = play N times. Older cached items only have `loop`.
function loopsOf(item) {
  if (typeof item.loops === 'number') return item.loops;
  return item.loop ? 0 : 1;
}

function armTimers(item) {
  clearTimeout(S.advanceTimer); S.advanceTimer = null;
  clearTimeout(S.safetyTimer);  S.safetyTimer = null;
  const def = (S.settings && S.settings.defaultDuration) || 60;
  const loops = loopsOf(item);

  // Timer-driven: anything that can't tell us when it finished.
  if (!isVideoType(item) || S.driveTimed) {
    const dur = item.duration > 0 ? item.duration : def;
    S.advanceTimer = setTimeout(next, Math.max(5, dur) * 1000);
    return;
  }

  // Videos run on their own length and advance after `loops` plays.
  // An explicit duration acts as a hard cap (useful for live streams).
  if (item.duration > 0) {
    S.advanceTimer = setTimeout(next, Math.max(5, item.duration) * 1000);
  }
  // Never sit forever on a stuck video — unless it's meant to loop forever.
  if (loops !== 0) {
    S.safetyTimer = setTimeout(next, 30 * 60 * 1000);
  }
}

// Once the real length is known, size the safety net to it instead of 30 min.
function tuneSafety(item, videoLength, elapsed) {
  const loops = loopsOf(item);
  if (loops === 0 || item.duration > 0 || !(videoLength > 0)) return;
  const remaining = videoLength * (loops - S.playCount) - (elapsed || 0);
  clearTimeout(S.safetyTimer);
  S.safetyTimer = setTimeout(next, (remaining + 30) * 1000);
}

// A video finished one pass: replay it or move on.
function onVideoEnded(item, replay) {
  if (S.currentId !== item.id) return;
  S.playCount++;
  const loops = loopsOf(item);
  if (loops === 0 || S.playCount < loops) replay();
  else next();
}

// ════════════════════════════════════════════════════════════
// Renderers
// ════════════════════════════════════════════════════════════

// Per-item override wins; otherwise the global setting.
function fitFor(item) {
  if (item.fit === 'cover' || item.fit === 'contain') return item.fit;
  return (S.settings && S.settings.videoFit === 'contain') ? 'contain' : 'cover';
}

// Size a 16:9 iframe so it covers the viewport, cropping the overflow.
// Re-applied on resize/rotation.
function coverIframe(f) {
  f.classList.add('cover');
  const apply = () => {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = vw, h = vw * 9 / 16;
    const scale = Math.max(1, vh / h);
    f.style.width  = w + 'px';
    f.style.height = h + 'px';
    f.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  };
  apply();
  if (S.coverResize) window.removeEventListener('resize', S.coverResize);
  S.coverResize = apply;
  window.addEventListener('resize', apply);
}

function renderWebsite(stage, item) {
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
  f.setAttribute('allowfullscreen', '');
  f.addEventListener('load', () => contentReady(item));
  f.src = item.url;
  stage.appendChild(f);
  // Websites reflow to the viewport, so they are never scaled — a portrait
  // screen simply gets the site's mobile layout.
}

function renderImage(stage, item) {
  const img = document.createElement('img');
  img.alt = item.title;
  img.style.objectFit = fitFor(item);
  img.addEventListener('load', () => contentReady(item));
  img.addEventListener('error', () => setTimeout(next, 1500), { once: true });
  img.src = item.url;
  stage.appendChild(img);
}

// Shared setup for a <video> element: autoplay muted (the only way browsers
// allow unattended playback), reveal on first frame, count loops.
function setupVideoEl(item, src, onFail) {
  const v = document.createElement('video');
  v.src = src;
  v.autoplay = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.setAttribute('autoplay', '');
  v.muted = !!(S.settings && S.settings.muted);
  v.loop = loopsOf(item) === 0;
  v.style.objectFit = fitFor(item);

  v.addEventListener('playing', () => contentReady(item));
  v.addEventListener('loadedmetadata', () => tuneSafety(item, v.duration, 0));
  if (!v.loop) {
    v.addEventListener('ended', () => onVideoEnded(item, () => {
      v.currentTime = 0;
      v.play().catch(() => {});
    }));
  }
  v.addEventListener('error', onFail, { once: true });

  const tryPlay = () => {
    const p = v.play();
    // Unmuted autoplay is blocked unless the kiosk browser allows it — retry muted.
    if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
  };
  tryPlay();
  v.addEventListener('canplay', tryPlay, { once: true });
  return v;
}

function renderVideo(stage, item) {
  stage.appendChild(setupVideoEl(item, item.url, () => setTimeout(next, 1500)));
}

function driveId(url) {
  let m = url.match(/\/file\/d\/([\w-]{10,})/);
  if (m) return m[1];
  m = url.match(/[?&]id=([\w-]{10,})/);
  if (m) return m[1];
  if (/^[\w-]{20,}$/.test(url)) return url;
  return null;
}

// Drive videos must play by themselves — no tap on a play button. So we stream
// the file into a <video> tag (autoplay + muted + loop all work there) instead
// of embedding Drive's player, which requires a click.
//   1. usercontent /download with confirm=t — also serves big, virus-scanned files
//   2. the classic uc?export=download endpoint
//   3. last resort: Drive's own embed (may need a tap; advances on a timer)
function renderDrive(stage, item) {
  const id = driveId(item.url);
  if (!id) { setTimeout(next, 1500); return; }

  const strategies = [
    'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t',
    'https://drive.google.com/uc?export=download&id=' + id
  ];
  let attempt = 0;

  const tryNextStrategy = () => {
    if (S.currentId !== item.id) return;
    clearTimeout(S.driveWatchdog);
    if (attempt >= strategies.length) { useDriveEmbed(); return; }
    const src = strategies[attempt++];
    stage.innerHTML = '';
    const v = setupVideoEl(item, src, tryNextStrategy);
    stage.appendChild(v);
    // Google answers some files with an HTML page instead of video bytes, and a
    // <video> stays silently black for that — no 'error' event. Poll instead.
    S.driveWatchdog = setTimeout(() => {
      if (S.currentId !== item.id) return;
      if (v.readyState < 2) tryNextStrategy();
    }, DRIVE_TRY_TIMEOUT);
  };

  const useDriveEmbed = () => {
    if (S.currentId !== item.id) return;
    S.driveTimed = true;   // no 'ended' from this player → run on a timer
    stage.innerHTML = '';
    const f = document.createElement('iframe');
    f.setAttribute('allow', 'autoplay; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.addEventListener('load', () => contentReady(item));
    f.src = 'https://drive.google.com/file/d/' + id + '/preview';
    stage.appendChild(f);
    if (fitFor(item) === 'cover') coverIframe(f);
    armTimers(item);
  };

  tryNextStrategy();
}

function ytId(url) {
  if (/^[\w-]{11}$/.test(url)) return url;
  let m = url.match(/[?&]v=([\w-]{11})/);
  if (m) return m[1];
  m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}

function loadYtApi() {
  if (S.ytApiPromise) return S.ytApiPromise;
  S.ytApiPromise = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = () => resolve();
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return S.ytApiPromise;
}

async function renderYouTube(stage, item) {
  const vid = ytId(item.url);
  if (!vid) { setTimeout(next, 1500); return; }

  const holder = document.createElement('div');
  holder.id = 'yt-' + Date.now();
  stage.appendChild(holder);

  await loadYtApi();
  if (S.currentId !== item.id) return; // rotation moved on while the API loaded
  const wantCover = fitFor(item) === 'cover';
  const muted = !!(S.settings && S.settings.muted);

  S.yt = new YT.Player(holder.id, {
    videoId: vid,
    width: '100%', height: '100%',
    playerVars: {
      autoplay: 1, controls: 0, disablekb: 1, rel: 0,
      modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0,
      mute: muted ? 1 : 0
      // No loop/playlist vars: repeats are counted on the ENDED event so that
      // "play N times" and "forever" share one code path.
    },
    events: {
      onReady: e => {
        if (muted) e.target.mute();
        if (wantCover) coverIframe(e.target.getIframe());
        e.target.playVideo();
        // Blocked unmuted autoplay? Fall back to muted playback.
        setTimeout(() => {
          try {
            if (S.yt && S.currentId === item.id &&
                S.yt.getPlayerState() !== YT.PlayerState.PLAYING) {
              S.yt.mute();
              S.yt.playVideo();
            }
          } catch (_) {}
        }, 2500);
      },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) {
          onVideoEnded(item, () => { e.target.seekTo(0); e.target.playVideo(); });
          return;
        }
        if (e.data === YT.PlayerState.PLAYING) {
          contentReady(item);
          try { tuneSafety(item, e.target.getDuration(), e.target.getCurrentTime()); } catch (_) {}
        }
      },
      onError: () => setTimeout(next, 1500)
    }
  });
}

// ════════════════════════════════════════════════════════════
// Waiting screen + clocks
// ════════════════════════════════════════════════════════════
function showStage(show) {
  $('stage').classList.toggle('visible', !!show);
  updateClockVisibility();
}

function stageVisible() {
  return $('stage').classList.contains('visible');
}

function startClocks() {
  const tick = () => {
    const now = new Date();
    const hm = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    $('fbClock').textContent = hm;
    $('fbDate').textContent = now.toLocaleDateString('he-IL', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    $('clockPill').textContent = hm;
  };
  tick();
  setInterval(tick, 1000);
}

function updateClockVisibility() {
  const show = S.settings && S.settings.showClock && stageVisible();
  $('clockPill').classList.toggle('show', !!show);
}

// ════════════════════════════════════════════════════════════
// Resilience
// ════════════════════════════════════════════════════════════
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) S.wakeLock = await navigator.wakeLock.request('screen');
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// Browsers only grant fullscreen from a user gesture, so try immediately (works
// in kiosk browsers that allow it) and again on the first touch of the screen.
function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (!req) return;
  const attempt = () => { try { req.call(el); } catch (_) {} };
  attempt();
  const onGesture = () => {
    if (!document.fullscreenElement) attempt();
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, onGesture, { passive: true }));
}

// Nightly reload keeps memory fresh on long-running kiosk browsers.
function checkDailyReload() {
  if (!S.settings || S.settings.dailyReloadHour < 0) return;
  const now = new Date();
  const day = now.toDateString();
  if (now.getHours() === S.settings.dailyReloadHour &&
      localStorage.getItem('kioskReloadDay') !== day) {
    localStorage.setItem('kioskReloadDay', day);
    location.reload();
  }
}

// Manual skip for on-site testing (keyboard / remote).
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === ' ') next();
});
</script>

</body>
</html>
