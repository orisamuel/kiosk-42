<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>הקיוסק של 42 — נגן</title>
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<script src="config.js"></script>
<script src="utils.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Heebo', 'Segoe UI', sans-serif;
  }

  /* ── Waiting screen ──
     Always rendered, sitting UNDER the stage. Any moment where content isn't
     ready yet (loading, switching, a broken item) shows this instead of black. */
  #idle {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    direction: rtl;
    background: radial-gradient(ellipse at 50% -20%, #2a2416 0%, #0d0f14 55%, #000 100%);
    color: #F1F5F9;
  }
  /* vmin so the waiting screen scales the same on landscape and portrait screens */
  #fbClock {
    font-size: 22vmin; font-weight: 800; line-height: 1;
    letter-spacing: 0.02em;
    color: #FBBF24;
    text-shadow: 0 0 80px rgba(245, 158, 11, 0.35);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  #fbDate { font-size: 4.6vmin; font-weight: 400; color: #94A3B8; margin-top: 2vh; text-align: center; }
  #fbMessage {
    font-size: 5vmin; font-weight: 700; color: #F1F5F9;
    margin-top: 7vh; text-align: center; padding: 0 8vmin; line-height: 1.35;
  }
  #fbName { font-size: 3.2vmin; font-weight: 600; color: #64748B; margin-top: 3vh; text-align: center; }
  #fbHint { font-size: 2.4vmin; color: #475569; margin-top: 2vh; text-align: center; padding: 0 6vmin; }

  /* ── Content stage ──
     Hidden until the content actually starts playing/loading is done, so a
     slow item never paints a black rectangle over the waiting screen. */
  #stage {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 2;
    pointer-events: none;
  }
  #stage.visible { opacity: 1; }
  #stage iframe, #stage video, #stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #000;
  }
  #stage video, #stage img { object-fit: contain; }
  /* "cover" mode for embedded players (YouTube/Drive): the iframe keeps a 16:9
     box and is scaled up until it covers the screen, so a portrait screen shows
     a cropped full-bleed video instead of thick black bars. */
  #stage iframe.cover {
    inset: auto; top: 50%; left: 50%;
    transform-origin: center center;
  }

  /* ── Clock overlay while content plays ── */
  #clockPill {
    position: fixed; bottom: 22px; left: 22px; z-index: 10;
    padding: 8px 18px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    color: #fff; font-size: 1.4rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
    direction: ltr;
    display: none;
  }
  #clockPill.show { display: block; }

  /* ── Offline indicator (only after repeated fetch failures) ── */
  #offlineDot {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    width: 10px; height: 10px; border-radius: 50%;
    background: #EF4444;
    box-shadow: 0 0 8px #EF4444;
    display: none;
    animation: blink 1.6s ease infinite;
  }
  #offlineDot.show { display: block; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* toasts are irrelevant on the kiosk screen */
  .toast-container { display: none !important; }

  /* ── On-screen file manager ── */
  #filesCorner {
    position: fixed; top: 0; left: 0; width: 12vmin; height: 12vmin;
    z-index: 40; cursor: none;
  }
  #files {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
    direction: rtl; cursor: auto;
  }
  #files.open { display: flex; }
  #filesBox {
    width: min(92vw, 720px); max-height: 86vh; overflow-y: auto;
    background: #161b24; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 3vmin; color: #F1F5F9;
  }
  #filesHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 2vmin; }
  #filesTitle { font-size: 3.4vmin; font-weight: 800; color: #FBBF24; }
  #filesQuota { font-size: 2vmin; color: #94A3B8; margin-top: 0.5vmin; }
  .fBtn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    color: #F1F5F9; border-radius: 12px; padding: 1.4vmin 2.4vmin;
    font-family: inherit; font-size: 2.2vmin; font-weight: 700;
  }
  .fPick {
    display: block; margin-top: 3vmin; padding: 3vmin;
    text-align: center; font-size: 2.8vmin; font-weight: 700;
    color: #0d0f14; background: linear-gradient(135deg, #FBBF24, #D97706);
    border-radius: 16px; cursor: pointer;
  }
  .fPick input { display: none; }
  #filesStatus { margin-top: 2vmin; font-size: 2.2vmin; color: #FBBF24; min-height: 2.6vmin; }
  .fRow {
    display: flex; align-items: center; gap: 2vmin;
    padding: 2vmin 0; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .fName { flex: 1; min-width: 0; font-size: 2.4vmin; font-weight: 600;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fMeta { font-size: 2vmin; color: #94A3B8; }
  .fEmpty { margin-top: 3vmin; font-size: 2.3vmin; color: #64748B; line-height: 1.6; }
</style>
</head>
<body>

<div id="idle">
  <div id="fbClock">--:--</div>
  <div id="fbDate"></div>
  <div id="fbMessage"></div>
  <div id="fbName"></div>
  <div id="fbHint"></div>
</div>

<div id="stage"></div>

<div id="clockPill">--:--</div>
<div id="offlineDot"></div>

<!-- ── On-screen file manager ──
     Opened at the kiosk itself (5 taps in the top-left corner, the F key, or
     ?files=1). Files picked here are copied into the device's own storage, so
     they play with no network and no size limit. -->
<div id="files">
  <div id="filesBox">
    <div id="filesHead">
      <div>
        <div id="filesTitle">קבצים על המסך</div>
        <div id="filesQuota"></div>
      </div>
      <button class="fBtn" onclick="closeFiles()">סגירה ✕</button>
    </div>
    <label class="fPick">
      <input type="file" id="filePicker" accept="video/*,image/*" multiple onchange="importFiles(this.files)">
      ＋ בחירת קבצים מהמכשיר
    </label>
    <div id="filesStatus"></div>
    <div id="filesList"></div>
  </div>
</div>

<div id="filesCorner"></div>

<script>
'use strict';

// How long to wait for an item to actually start before giving up on it.
// The waiting screen is showing throughout, so this is never a black screen.
const LOAD_TIMEOUT_MS   = 7000;
const DRIVE_TRY_TIMEOUT = 3000;   // per Drive URL strategy
const SINGLE_RETRY_MS   = 20000;  // lone broken item: retry instead of rotating
const MAX_NATIVE_PX     = 2560;   // largest player width we ask the device to render

// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
const S = {
  items: [],            // active items, sorted by order
  settings: null,
  token: null,          // reloadToken adopted on first fetch; change → reload
  idx: -1,
  currentId: null,
  currentTitle: null,
  currentItemJson: null,
  playCount: 0,         // completed plays of the current video
  advanceTimer: null,
  safetyTimer: null,
  loadTimer: null,
  pollTimer: null,
  yt: null,             // current YT.Player instance
  ytApiPromise: null,
  failStreak: 0,
  wakeLock: null,
  driveWatchdog: null,
  timedAdvance: false,    // Drive fell back to its own player → advance on a timer
  coverResize: null,
  objectUrl: null,      // blob URL of the local file on screen (revoked on switch)
  localNames: [],       // files stored on this device, reported in the heartbeat
  gapTimer: null,       // deliberate waiting-screen pause between items
  filesOpen: false,
  filesAutoClose: null,
  preload: null         // { id, el|img, blobUrl } — next item, warmed in advance
};

const CACHE_KEY = 'kioskCache';
const $ = id => document.getElementById(id);

// ════════════════════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════════════════════
(function boot() {
  startClocks();
  requestWakeLock();
  goFullscreen();

  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.includes('PASTE_')) {
    $('fbName').textContent = 'הקיוסק של 42';
    $('fbHint').textContent = '⚠ יש להגדיר את SCRIPT_URL בקובץ config.js';
    return;
  }

  // Start instantly from the last known playlist, then fetch fresh.
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (cached && cached.items) applyData(cached, true);
  } catch (_) {}

  warmupServer();
  refreshLocalNames().then(poll);

  if (/[?&#]files/.test(location.href)) openFiles();
})();

// ════════════════════════════════════════════════════════════
// Files stored on the kiosk itself
// A file picked here is copied into the device's own storage (IndexedDB), so it
// plays with no network, no upload and no size limit beyond the device's disk.
// ════════════════════════════════════════════════════════════
const DB_NAME = 'kioskFiles', DB_STORE = 'files';

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(DB_STORE)) {
        r.result.createObjectStore(DB_STORE, { keyPath: 'name' });
      }
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function idbRun(mode, fn) {
  return idb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

const filePut  = rec  => idbRun('readwrite', s => s.put(rec));
const fileGet  = name => idbRun('readonly',  s => s.get(name));
const fileDel  = name => idbRun('readwrite', s => s.delete(name));
const fileList = ()   => idbRun('readonly',  s => s.getAll());

async function refreshLocalNames() {
  try {
    const all = await fileList();
    S.localNames = all.map(f => f.name);
  } catch (_) { S.localNames = []; }
}

// ════════════════════════════════════════════════════════════
// Polling — fetch playlist + report heartbeat
// ════════════════════════════════════════════════════════════
async function poll() {
  try {
    const res = await apiCall('getPlaylist', {
      current: S.currentTitle || 'מסך המתנה',
      // Tell the admin panel which files live on this screen, so items can be
      // pointed at them from the phone.
      files: S.localNames.slice(0, 25).join('|')
    });
    // A non-JSON reply (Google error page during a redeploy) must never be
    // mistaken for an empty playlist — that would blank a working screen.
    if (res.success && Array.isArray(res.items)) {
      S.failStreak = 0;
      applyData(res, false);
    } else {
      S.failStreak++;
    }
  } catch (e) {
    S.failStreak++;
  }
  $('offlineDot').classList.toggle('show', S.failStreak >= 3);

  const sec = (S.settings && S.settings.refreshSeconds) || 60;
  clearTimeout(S.pollTimer);
  S.pollTimer = setTimeout(poll, Math.max(15, sec) * 1000);

  checkDailyReload();
}

function applyData(res, fromCache) {
  const settings = res.settings || {};

  if (!fromCache) {
    // Admin pressed "רענן מסך" (or pushed new frontend) → full reload.
    if (S.token !== null && settings.reloadToken !== S.token) {
      location.reload();
      return;
    }
    S.token = settings.reloadToken;
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ items: res.items, settings: settings }));
    } catch (_) {}
  }

  S.settings = settings;
  $('fbName').textContent = settings.kioskName || '';
  $('fbMessage').textContent = settings.idleMessage || '';
  updateClockVisibility();

  const active = (res.items || []).filter(i => i.active);

  if (!active.length) {
    stopCurrent();
    S.items = []; S.idx = -1; S.currentId = null; S.currentTitle = null;
    showStage(false);
    return;
  }

  const changed = JSON.stringify(active) !== JSON.stringify(S.items);
  if (!changed) {
    if (S.currentId === null) { S.idx = -1; next(); }
    return;
  }

  const oldCurrentId = S.currentId;
  S.items = active;
  dropPreload();   // the queue changed, so a warmed item may no longer be next
  const newIdx = oldCurrentId ? active.findIndex(i => i.id === oldCurrentId) : -1;

  if (newIdx !== -1) {
    // Current item survived the update — keep playing unless it was edited.
    S.idx = newIdx;
    if (JSON.stringify(active[newIdx]) !== S.currentItemJson) renderItem(active[newIdx]);
  } else {
    S.idx = -1;
    next();
  }
}

// ════════════════════════════════════════════════════════════
// Rotation
// ════════════════════════════════════════════════════════════
function next() {
  if (!S.items.length) { showStage(false); return; }
  const prevId = S.currentId;
  S.idx = (S.idx + 1) % S.items.length;
  const item = S.items[S.idx];

  // Single static item — don't flash-reload it, just re-arm the timer.
  if (S.items.length === 1 && item.id === prevId &&
      (item.type === 'website' || item.type === 'image')) {
    armTimers(item);
    return;
  }

  // Deliberate breather on the waiting screen between items. Skipped when
  // nothing was playing yet (boot) or when a single item owns the screen.
  const gap = gapMs();
  if (gap > 0 && prevId && S.items.length > 1) { gapThenRender(item, gap); return; }

  renderItem(item);
}

function gapMs() {
  const sec = S.settings ? S.settings.gapSeconds : 10;
  return Math.max(0, (typeof sec === 'number' ? sec : 10)) * 1000;
}

// Show the waiting screen for a moment, warming the upcoming item meanwhile.
function gapThenRender(item, gap) {
  stopCurrent();
  $('stage').innerHTML = '';
  showStage(false);
  S.currentId = null;
  S.currentTitle = null;      // the heartbeat reports the waiting screen
  preloadItem(item);
  S.gapTimer = setTimeout(() => renderItem(item), gap);
}

function renderItem(item) {
  stopCurrent();
  S.currentId = item.id;
  S.currentTitle = item.title;
  S.currentItemJson = JSON.stringify(item);
  S.playCount = 0;
  S.timedAdvance = false;

  // Hide the stage while the new item loads → the waiting screen shows through.
  showStage(false);
  const stage = $('stage');
  stage.innerHTML = '';

  switch (item.type) {
    case 'youtube': renderYouTube(stage, item); break;
    case 'video':   renderVideo(stage, item);   break;
    case 'drive':   renderDrive(stage, item);   break;
    case 'local':   renderLocal(stage, item);   break;
    case 'image':   renderImage(stage, item);   break;
    default:        renderWebsite(stage, item); break;
  }

  armLoadTimeout(item, LOAD_TIMEOUT_MS);
  armTimers(item);
}

// If an item never starts, move on (or retry when it's the only one) instead of
// sitting on it. Renderers that swap sources re-arm this for each attempt.
function armLoadTimeout(item, ms) {
  clearTimeout(S.loadTimer);
  S.loadTimer = setTimeout(() => {
    if (S.currentId !== item.id || stageVisible()) return;
    if (S.items.length > 1) next();
    else { S.currentId = null; setTimeout(() => renderItem(item), SINGLE_RETRY_MS); }
  }, ms);
}

// Content is actually up — reveal it over the waiting screen.
function contentReady(item) {
  if (S.currentId !== item.id) return;
  clearTimeout(S.loadTimer);
  showStage(true);
  // Now that this item is up, start warming the next one.
  setTimeout(preloadNext, 1200);
}

function stopCurrent() {
  clearTimeout(S.gapTimer);      S.gapTimer = null;
  clearTimeout(S.advanceTimer);  S.advanceTimer = null;
  clearTimeout(S.safetyTimer);   S.safetyTimer = null;
  clearTimeout(S.loadTimer);     S.loadTimer = null;
  clearTimeout(S.driveWatchdog); S.driveWatchdog = null;
  if (S.objectUrl) { URL.revokeObjectURL(S.objectUrl); S.objectUrl = null; }
  if (S.coverResize) { window.removeEventListener('resize', S.coverResize); S.coverResize = null; }
  if (S.yt) { try { S.yt.destroy(); } catch (_) {} S.yt = null; }
}

function isVideoType(item) {
  return item.type === 'youtube' || item.type === 'video' ||
         item.type === 'drive'   || item.type === 'local';
}

// 0 = play forever, N = play N times. Older cached items only have `loop`.
function loopsOf(item) {
  if (typeof item.loops === 'number') return item.loops;
  return item.loop ? 0 : 1;
}

function armTimers(item) {
  clearTimeout(S.advanceTimer); S.advanceTimer = null;
  clearTimeout(S.safetyTimer);  S.safetyTimer = null;
  const def = (S.settings && S.settings.defaultDuration) || 60;
  const loops = loopsOf(item);

  // Timer-driven: anything that can't tell us when it finished.
  if (!isVideoType(item) || S.timedAdvance) {
    const dur = item.duration > 0 ? item.duration : def;
    S.advanceTimer = setTimeout(next, Math.max(5, dur) * 1000);
    return;
  }

  // Videos run on their own length and advance after `loops` plays.
  // An explicit duration acts as a hard cap (useful for live streams).
  if (item.duration > 0) {
    S.advanceTimer = setTimeout(next, Math.max(5, item.duration) * 1000);
  }
  // Never sit forever on a stuck video — unless it's meant to loop forever.
  if (loops !== 0) {
    S.safetyTimer = setTimeout(next, 30 * 60 * 1000);
  }
}

// Once the real length is known, size the safety net to it instead of 30 min.
function tuneSafety(item, videoLength, elapsed) {
  const loops = loopsOf(item);
  if (loops === 0 || item.duration > 0 || !(videoLength > 0)) return;
  const remaining = videoLength * (loops - S.playCount) - (elapsed || 0);
  clearTimeout(S.safetyTimer);
  S.safetyTimer = setTimeout(next, (remaining + 30) * 1000);
}

// A video finished one pass: replay it or move on.
function onVideoEnded(item, replay) {
  if (S.currentId !== item.id) return;
  S.playCount++;
  const loops = loopsOf(item);
  if (loops === 0 || S.playCount < loops) replay();
  else next();
}

// ════════════════════════════════════════════════════════════
// Renderers
// ════════════════════════════════════════════════════════════

// Per-item override wins; otherwise the global setting.
function fitFor(item) {
  if (item.fit === 'cover' || item.fit === 'contain') return item.fit;
  return (S.settings && S.settings.videoFit === 'contain') ? 'contain' : 'cover';
}

// Size a 16:9 iframe so it covers the viewport, cropping the overflow.
// YouTube picks its stream from the player's OWN size, so a small iframe blown
// up with a CSS scale looks soft. We therefore hand the iframe close to its real
// covered size in CSS pixels, and only fall back to scaling above MAX_NATIVE_PX
// so a weak streamer isn't asked to composite an enormous surface.
// Re-applied on resize/rotation.
function coverIframe(f) {
  f.classList.add('cover');
  const apply = () => {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = vw * 9 / 16;
    if (h < vh) { h = vh; w = vh * 16 / 9; }   // portrait screen: cover by height
    const shrink = w > MAX_NATIVE_PX ? MAX_NATIVE_PX / w : 1;
    f.style.width  = Math.round(w * shrink) + 'px';
    f.style.height = Math.round(h * shrink) + 'px';
    f.style.transform = shrink === 1
      ? 'translate(-50%, -50%)'
      : 'translate(-50%, -50%) scale(' + (1 / shrink) + ')';
  };
  apply();
  if (S.coverResize) window.removeEventListener('resize', S.coverResize);
  S.coverResize = apply;
  window.addEventListener('resize', apply);
}

function renderWebsite(stage, item) {
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
  f.setAttribute('allowfullscreen', '');
  f.addEventListener('load', () => contentReady(item));
  f.src = item.url;
  stage.appendChild(f);
  // Websites reflow to the viewport, so they are never scaled — a portrait
  // screen simply gets the site's mobile layout.
}

function renderImage(stage, item) {
  const img = document.createElement('img');
  img.alt = item.title;
  img.style.objectFit = fitFor(item);
  img.addEventListener('load', () => contentReady(item));
  img.addEventListener('error', () => setTimeout(next, 1500), { once: true });
  img.src = item.url;
  stage.appendChild(img);
}

// Build a <video> for an item. `start` false only buffers it (used to warm the
// next item up in the background) — nothing plays until startVideo() is called.
function makeVideoEl(item, src, onFail, start) {
  const v = document.createElement('video');
  v.preload = 'auto';
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.muted = !!(S.settings && S.settings.muted);
  v.loop = loopsOf(item) === 0;
  v.style.objectFit = fitFor(item);
  v.src = src;

  v.addEventListener('playing', () => contentReady(item));
  v.addEventListener('loadedmetadata', () => tuneSafety(item, v.duration, 0));
  if (!v.loop) {
    v.addEventListener('ended', () => onVideoEnded(item, () => {
      v.currentTime = 0;
      v.play().catch(() => {});
    }));
  }
  if (onFail) v.addEventListener('error', onFail, { once: true });

  if (start) startVideo(v);
  return v;
}

// Autoplay muted is the only form browsers allow unattended; if an unmuted
// attempt is blocked we retry muted rather than sit on a frozen frame.
function startVideo(v) {
  v.autoplay = true;
  v.setAttribute('autoplay', '');
  const tryPlay = () => {
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
  };
  tryPlay();
  v.addEventListener('canplay', tryPlay, { once: true });
}

// ── Warming the next item ──
// Called once the current item is on screen: the following item's video starts
// buffering (or its image downloads) in the background, so the switch is short
// and the waiting screen shows for less time.
function preloadNext() {
  if (S.items.length < 2) return;
  preloadItem(S.items[(S.idx + 1) % S.items.length]);
}

function preloadItem(item) {
  if (!item || (S.preload && S.preload.id === item.id)) return;
  dropPreload();

  if (item.type === 'image') {
    const img = new Image();
    img.src = item.url;
    S.preload = { id: item.id, img: img };
  } else if (item.type === 'video') {
    S.preload = { id: item.id, el: makeVideoEl(item, item.url, null, false) };
  } else if (item.type === 'local') {
    fileGet(item.url).then(rec => {
      if (!rec || !rec.blob || (S.preload && S.preload.id === item.id)) return;
      const url = URL.createObjectURL(rec.blob);
      S.preload = { id: item.id, el: makeVideoEl(item, url, null, false), blobUrl: url };
    }).catch(() => {});
  }
  // YouTube and websites can't be warmed without a second live player, so they
  // rely on the preconnect hints instead.
}

function dropPreload() {
  if (!S.preload) return;
  if (S.preload.el) { try { S.preload.el.removeAttribute('src'); S.preload.el.load(); } catch (_) {} }
  if (S.preload.blobUrl) URL.revokeObjectURL(S.preload.blobUrl);
  S.preload = null;
}

// Hand over the warmed element for this item, if we have one.
function takePreloaded(item) {
  if (S.preload && S.preload.id === item.id && S.preload.el) {
    const taken = S.preload;
    S.preload = null;
    return taken;
  }
  return null;
}

function renderVideo(stage, item) {
  const warm = takePreloaded(item);
  if (warm) {
    stage.appendChild(warm.el);
    startVideo(warm.el);
    return;
  }
  stage.appendChild(makeVideoEl(item, item.url, () => setTimeout(next, 1500), true));
}

// A file sitting in this device's own storage. `url` holds the file name.
async function renderLocal(stage, item) {
  let rec = null;
  try { rec = await fileGet(item.url); } catch (_) {}
  if (S.currentId !== item.id) return;
  if (!rec || !rec.blob) {
    // The playlist points at a file this screen doesn't have — skip it and let
    // the admin see the mismatch in the panel.
    setTimeout(next, 1200);
    return;
  }
  const warm = takePreloaded(item);
  if (warm && (rec.type || '').indexOf('image/') !== 0) {
    S.objectUrl = warm.blobUrl;
    stage.appendChild(warm.el);
    startVideo(warm.el);
    return;
  }
  S.objectUrl = URL.createObjectURL(rec.blob);
  if ((rec.type || '').indexOf('image/') === 0) {
    const img = document.createElement('img');
    img.style.objectFit = fitFor(item);
    img.addEventListener('load', () => contentReady(item));
    img.src = S.objectUrl;
    stage.appendChild(img);
    S.timedAdvance = true;  // images advance on a timer, like any still content
    armTimers(item);
  } else {
    stage.appendChild(makeVideoEl(item, S.objectUrl, () => setTimeout(next, 1500), true));
  }
}

function driveId(url) {
  let m = url.match(/\/file\/d\/([\w-]{10,})/);
  if (m) return m[1];
  m = url.match(/[?&]id=([\w-]{10,})/);
  if (m) return m[1];
  if (/^[\w-]{20,}$/.test(url)) return url;
  return null;
}

// Drive videos should play by themselves — no tap on a play button — so we try
// to stream the file into a <video> tag first (autoplay + muted + loop all work
// there). Heads up: Google usually refuses to serve Drive video bytes to a page
// on another domain, even for "anyone with the link" files, so these attempts
// often fail and we end up on Drive's own embed, which may want a tap. A video
// that must autoplay is safer hosted next to this player (see README) or on
// YouTube. Each attempt is kept short so the waiting screen isn't held for long.
function renderDrive(stage, item) {
  const id = driveId(item.url);
  if (!id) { setTimeout(next, 1500); return; }

  const strategies = [
    'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t',
    'https://drive.google.com/uc?export=download&id=' + id
  ];
  let attempt = 0;

  const tryNextStrategy = () => {
    if (S.currentId !== item.id) return;
    clearTimeout(S.driveWatchdog);
    if (attempt >= strategies.length) { useDriveEmbed(); return; }
    const src = strategies[attempt++];
    stage.innerHTML = '';
    const v = makeVideoEl(item, src, tryNextStrategy, true);
    stage.appendChild(v);
    // Keep the item alive while we work through the strategies — the generic
    // load timeout would otherwise skip it mid-chain.
    armLoadTimeout(item, DRIVE_TRY_TIMEOUT * (strategies.length - attempt + 2));
    // Google answers some files with an HTML page instead of video bytes, and a
    // <video> stays silently black for that — no 'error' event. Poll instead.
    S.driveWatchdog = setTimeout(() => {
      if (S.currentId !== item.id) return;
      if (v.readyState < 2) tryNextStrategy();
    }, DRIVE_TRY_TIMEOUT);
  };

  const useDriveEmbed = () => {
    if (S.currentId !== item.id) return;
    S.timedAdvance = true;   // no 'ended' from this player → run on a timer
    stage.innerHTML = '';
    const f = document.createElement('iframe');
    f.setAttribute('allow', 'autoplay; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.addEventListener('load', () => contentReady(item));
    f.src = 'https://drive.google.com/file/d/' + id + '/preview';
    stage.appendChild(f);
    if (fitFor(item) === 'cover') coverIframe(f);
    armLoadTimeout(item, LOAD_TIMEOUT_MS);
    armTimers(item);
  };

  tryNextStrategy();
}

function ytId(url) {
  if (/^[\w-]{11}$/.test(url)) return url;
  let m = url.match(/[?&]v=([\w-]{11})/);
  if (m) return m[1];
  m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}

function loadYtApi() {
  if (S.ytApiPromise) return S.ytApiPromise;
  S.ytApiPromise = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = () => resolve();
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return S.ytApiPromise;
}

// YouTube treats quality as a hint, not a command: it still decides from the
// player size and the network. We ask for the best level it reports anyway.
function pickBestQuality(player) {
  try {
    const levels = player.getAvailableQualityLevels();
    if (levels && levels.length) player.setPlaybackQuality(levels[0]);
    else player.setPlaybackQuality('highres');
  } catch (_) {}
}

async function renderYouTube(stage, item) {
  const vid = ytId(item.url);
  if (!vid) { setTimeout(next, 1500); return; }

  const holder = document.createElement('div');
  holder.id = 'yt-' + Date.now();
  stage.appendChild(holder);

  await loadYtApi();
  if (S.currentId !== item.id) return; // rotation moved on while the API loaded
  const wantCover = fitFor(item) === 'cover';
  const muted = !!(S.settings && S.settings.muted);

  S.yt = new YT.Player(holder.id, {
    videoId: vid,
    width: '100%', height: '100%',
    playerVars: {
      autoplay: 1, controls: 0, disablekb: 1, rel: 0,
      modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0,
      mute: muted ? 1 : 0, vq: 'hd1080'
      // No loop/playlist vars: repeats are counted on the ENDED event so that
      // "play N times" and "forever" share one code path.
    },
    events: {
      onReady: e => {
        if (muted) e.target.mute();
        if (wantCover) coverIframe(e.target.getIframe());
        pickBestQuality(e.target);
        e.target.playVideo();
        // Blocked unmuted autoplay? Fall back to muted playback.
        setTimeout(() => {
          try {
            if (S.yt && S.currentId === item.id &&
                S.yt.getPlayerState() !== YT.PlayerState.PLAYING) {
              S.yt.mute();
              S.yt.playVideo();
            }
          } catch (_) {}
        }, 2500);
      },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) {
          onVideoEnded(item, () => { e.target.seekTo(0); e.target.playVideo(); });
          return;
        }
        if (e.data === YT.PlayerState.PLAYING) {
          contentReady(item);
          pickBestQuality(e.target);   // levels are only known once playing
          try { tuneSafety(item, e.target.getDuration(), e.target.getCurrentTime()); } catch (_) {}
        }
      },
      onError: () => setTimeout(next, 1500)
    }
  });
}

// ════════════════════════════════════════════════════════════
// Waiting screen + clocks
// ════════════════════════════════════════════════════════════
function showStage(show) {
  $('stage').classList.toggle('visible', !!show);
  updateClockVisibility();
}

function stageVisible() {
  return $('stage').classList.contains('visible');
}

function startClocks() {
  const tick = () => {
    const now = new Date();
    const hm = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    $('fbClock').textContent = hm;
    $('fbDate').textContent = now.toLocaleDateString('he-IL', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    $('clockPill').textContent = hm;
  };
  tick();
  setInterval(tick, 1000);
}

function updateClockVisibility() {
  const show = S.settings && S.settings.showClock && stageVisible();
  $('clockPill').classList.toggle('show', !!show);
}

// ════════════════════════════════════════════════════════════
// File manager UI (used at the kiosk itself)
// ════════════════════════════════════════════════════════════
function openFiles() {
  S.filesOpen = true;
  $('files').classList.add('open');
  document.body.style.cursor = 'auto';
  drawFiles();
  // Never let the manager be left open on a public screen.
  clearTimeout(S.filesAutoClose);
  S.filesAutoClose = setTimeout(closeFiles, 3 * 60 * 1000);
}

function closeFiles() {
  S.filesOpen = false;
  $('files').classList.remove('open');
  document.body.style.cursor = 'none';
  clearTimeout(S.filesAutoClose);
  $('filesStatus').textContent = '';
}

function fmtSize(b) {
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1048576)    return Math.round(b / 1048576) + ' MB';
  return Math.max(1, Math.round(b / 1024)) + ' KB';
}

async function drawFiles() {
  const list = $('filesList');
  let all = [];
  try { all = await fileList(); } catch (e) { list.textContent = 'שגיאת אחסון: ' + e; return; }

  try {
    if (navigator.storage && navigator.storage.estimate) {
      const q = await navigator.storage.estimate();
      $('filesQuota').textContent = 'בשימוש ' + fmtSize(q.usage || 0) +
        ' מתוך ' + fmtSize(q.quota || 0) + ' זמינים במכשיר';
    }
  } catch (_) {}

  if (!all.length) {
    list.innerHTML = '<div class="fEmpty">אין עדיין קבצים על המסך הזה.<br>' +
      'בוחרים קובץ מהמכשיר, והוא נשמר כאן ומתנגן גם בלי אינטרנט.<br>' +
      'אחרי הבחירה הוא נוסף לפלייליסט אוטומטית.</div>';
    return;
  }
  list.innerHTML = all.map(f => `
    <div class="fRow">
      <span class="fName">${(f.type || '').indexOf('image/') === 0 ? '🖼️' : '🎬'} ${escapeHtml(f.name)}</span>
      <span class="fMeta">${fmtSize(f.size || 0)}</span>
      <button class="fBtn" onclick="removeFile('${escapeHtml(f.name).replace(/'/g, "\\'")}')">מחיקה</button>
    </div>`).join('');
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function importFiles(fileList_) {
  const files = Array.from(fileList_ || []);
  if (!files.length) return;
  const status = $('filesStatus');

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    status.textContent = `שומר ${i + 1}/${files.length}: ${f.name} (${fmtSize(f.size)})...`;
    try {
      await filePut({ name: f.name, blob: f, size: f.size, type: f.type, added: Date.now() });
    } catch (e) {
      status.textContent = 'לא הצלחתי לשמור את ' + f.name + ' — ' + (e.name === 'QuotaExceededError'
        ? 'אין מספיק מקום פנוי במכשיר' : e);
      return;
    }
    // Register it in the playlist so it starts showing without a second step.
    try {
      const res = await apiCall('addItem', {
        title: f.name.replace(/\.[^.]+$/, ''),
        type: 'local',
        url: f.name,
        duration: 0,
        loops: '1',
        fit: ''
      });
      if (!res.success) status.textContent = 'נשמר, אבל ההוספה לפלייליסט נכשלה: ' + res.message;
    } catch (e) {
      status.textContent = 'הקובץ נשמר על המסך, אבל אין כרגע חיבור לשרת — הוסיפו אותו לפלייליסט מהנייד.';
    }
  }

  await refreshLocalNames();
  status.textContent = files.length + ' קבצים נשמרו ונוספו לפלייליסט ✓';
  $('filePicker').value = '';
  drawFiles();
  // Ask the browser to keep these files instead of evicting them under pressure.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  poll();
}

async function removeFile(name) {
  try { await fileDel(name); } catch (_) {}
  await refreshLocalNames();
  $('filesStatus').textContent = 'נמחק: ' + name + ' (אם הוא בפלייליסט — מחקו אותו גם מהנייד)';
  drawFiles();
  poll();
}

// Hidden touch targets: 5 taps top-left opens the file manager, 5 taps
// top-right toggles fullscreen. Nothing is visible on the screen itself.
function cornerTaps(id, action) {
  let taps = 0, timer = null;
  $(id).addEventListener('pointerdown', () => {
    taps++;
    clearTimeout(timer);
    timer = setTimeout(() => { taps = 0; }, 2500);
    if (taps >= 5) { taps = 0; action(); }
  });
}
cornerTaps('filesCorner', openFiles);

// ════════════════════════════════════════════════════════════
// Resilience
// ════════════════════════════════════════════════════════════
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) S.wakeLock = await navigator.wakeLock.request('screen');
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// Fullscreen. Browsers only grant it from a user gesture, so we try on load
// (kiosk browsers usually allow it) and again on the first touch — but never
// after someone deliberately left it, otherwise there'd be no way out.
let userLeftFullscreen = false;

function fsOn() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (req) { try { req.call(el); } catch (_) {} }
}

function leaveFullscreen() {
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (ex) { try { ex.call(document); } catch (_) {} }
}

function toggleFullscreen() {
  if (fsOn()) { userLeftFullscreen = true; leaveFullscreen(); }
  else { userLeftFullscreen = false; enterFullscreen(); }
}

function goFullscreen() {
  // Kiosk browsers usually grant this on load; a normal browser will refuse
  // until it sees a gesture, which the double tap below provides.
  enterFullscreen();

  // Double tap anywhere toggles fullscreen — in and out, same gesture.
  let lastTap = 0;
  document.addEventListener('pointerdown', e => {
    if (S.filesOpen) return;                    // the manager has its own buttons
    const now = e.timeStamp || Date.now();
    if (now - lastTap < 450) { lastTap = 0; toggleFullscreen(); }
    else lastTap = now;
  }, { passive: true });
}

// Nightly reload keeps memory fresh on long-running kiosk browsers.
function checkDailyReload() {
  if (!S.settings || S.settings.dailyReloadHour < 0) return;
  const now = new Date();
  const day = now.toDateString();
  if (now.getHours() === S.settings.dailyReloadHour &&
      localStorage.getItem('kioskReloadDay') !== day) {
    localStorage.setItem('kioskReloadDay', day);
    location.reload();
  }
}

// On-site controls (keyboard / remote): skip an item, or open the file manager.
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F' || e.key === 'א') {
    S.filesOpen ? closeFiles() : openFiles();
    return;
  }
  if (e.key === 'Escape' && S.filesOpen) { closeFiles(); return; }
  if (e.key === 'x' || e.key === 'X') { toggleFullscreen(); return; }
  if (S.filesOpen) return;   // don't rotate content behind the manager
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === ' ') next();
});
</script>
